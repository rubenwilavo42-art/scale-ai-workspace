appId: ai.scalai.desktop
productName: ScalAI

# Keep the shipped copyright explicit so electron-builder never derives a different
# no `copyright` it builds NSHumanReadableCopyright out of `author`, so every
# shipped bundle carried "Copyright © 2026 Calvin Hia" in its Info.plist and in
# the About panel, a string nobody had written anywhere. The year is the
# release's, so it is written out rather than taken from the build machine's
# clock. main.js sets the same string on the About panel for dev runs.
copyright: Copyright © 2026 sacalai.vatsk.rub
directories:
  output: release
  buildResources: build

# Release hosting is intentionally handled by CI rather than embedded in the app.
# The installed app never contains a GitHub token or repository credential.
#
# The onnxruntime-node trim below used to live here unconditionally, stripping
# win32 out of every build regardless of target platform. That's harmless for a
# Mac-only build but fatal for a Windows one: the app would ship without the
# native binary it dlopens at runtime and crash on first inference. Each
# platform's own onnxruntime-node slice now lives in that platform's `files`
# override below instead, so it only strips the *other* platforms' binaries.
files:
  - src/**/*
  - package.json
  - '!**/*.map'

  # 68 MB: transformers declares onnxruntime-web as a hard dependency, but the
  # build we actually load (dist/transformers.node.mjs) imports only node:*,
  # onnxruntime-common, onnxruntime-node and sharp. Nothing reaches for -web.
  - '!node_modules/onnxruntime-web/**'

  # 28 MB: of that dist we need exactly one file. The rest is the browser build,
  # its 21.6 MB ORT wasm, and source maps — none of it reachable from main.
  - '!node_modules/@huggingface/transformers/dist/!(transformers.node.mjs)'

# whisper-tiny.en, so a fresh install transcribes with no network and no
# account. main.js copies this into userData on first launch: the app bundle is
# read-only, and a later model upgrade has to land somewhere writable.
# Populated by `npm run fetch-model` (wired to prepack).
extraResources:
  - from: build/models
    to: models
    filter: ['**/*']

# Native binaries cannot be dlopen'd from inside an asar archive.
asarUnpack:
  - '**/node_modules/onnxruntime-node/bin/**'
  - '**/node_modules/@lydell/node-pty/**'
  - '**/*.node'

# The dmg is what the user downloads, so it is what carries the quarantine flag
# and what Gatekeeper judges first. electron-builder signs the app and leaves the
# container unsigned, which reads as "unidentified developer" before anyone has
# seen the app. Sign it here; notarize it in the hook below.
dmg:
  sign: true
afterAllArtifactBuild: scripts/notarize-dmg.mjs

# Keep artifact names stable across releases. A distribution site or update service
# can then point at the same filename while the version remains in the release metadata.
artifactName: ${productName}-${arch}.${ext}

mac:
  # Platform-specific `files` fully replace the top-level list rather than
  # merging with it, so this repeats the shared entries above and adds only
  # the Mac slice of onnxruntime-node: the other platforms' native binaries,
  # and the Mac architecture not being built.
  files:
    - src/**/*
    - package.json
    - '!**/*.map'
    - '!node_modules/onnxruntime-web/**'
    - '!node_modules/@huggingface/transformers/dist/!(transformers.node.mjs)'
    # 170 MB: the ORT tarball carries every platform. win32 + linux is DirectML
    # and CUDA that a Mac build can never load.
    - '!node_modules/onnxruntime-node/bin/napi-v3/win32/**'
    - '!node_modules/onnxruntime-node/bin/napi-v3/linux/**'
    # 34 MB: and of the two Mac slices, keep only the one being built.
    - '!node_modules/onnxruntime-node/bin/napi-v3/darwin/!(${arch})/**'
  category: public.app-category.developer-tools
  target:
    # What a person downloads. Carries the quarantine flag, gets judged by
    # Gatekeeper, and is what the website links to.
    - target: dmg
      arch: [arm64, x64]
    # What the updater installs, and the only thing it can install: on macOS
    # electron-updater hands the swap to Squirrel.Mac, which unpacks a zip of
    # the .app. A release with only dmgs on it has nothing an update can use.
    # Nobody clicks this file; it exists for latest-mac.yml to point at.
    - target: zip
      arch: [arm64, x64]
  # What ScalAI offers to open. Declaring a type only puts ScalAI in Finder's
  # "Open With" — it never takes a default; the person still picks one.
  #
  # The list is short on purpose. These are documents ScalAI renders as a tile
  # today and that a workbench plausibly owns. Images, video, audio and PDF
  # belong to Preview, and .json / .yml belong to an editor: appearing in
  # everything's Open With menu is noise, not a feature. Keep this in step with
  # OPEN_EXT in src/main/open-with.js, which decides where the file lands.
  #
  # rank Alternate, not electron-builder's default of Default: a workbench does
  # not own markdown. Alternate keeps ScalAI in the Open With list without ever
  # winning the type on its own, so installing ScalAI never silently changes what
  # a double-click does. Setting it as the default stays a deliberate act —
  # Get Info → Open With → Change All.
  fileAssociations:
    - ext: [md, markdown, mdx]
      name: Markdown document
      role: Editor
      rank: Alternate
    - ext: [txt, text]
      name: Plain text document
      role: Editor
      rank: Alternate
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: >-
      ScalAI uses your microphone so you can dictate into a session instead of
      typing.

# No certificateFile/certificatePassword is configured, so this build is
# unsigned by design: Windows SmartScreen will warn on first run, same as the
# Mac review build is unsigned and Gatekeeper warns on first run. Signing is a
# deliberate later step, not a blocker to shipping a build people can run.
win:
  # Same reasoning as mac.files above: this replaces rather than merges with
  # the top-level `files`, so it repeats the shared entries and keeps only the
  # win32 slice of onnxruntime-node.
  files:
    - src/**/*
    - package.json
    - '!**/*.map'
    - '!node_modules/onnxruntime-web/**'
    - '!node_modules/@huggingface/transformers/dist/!(transformers.node.mjs)'
    - '!node_modules/onnxruntime-node/bin/napi-v3/darwin/**'
    - '!node_modules/onnxruntime-node/bin/napi-v3/linux/**'
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

# Publish an unsigned macOS review build on every push to main, replacing
# the previous release under a single rolling prerelease tag. Signing is a
# deliberate later step, not a blocker to shipping something people can run.
name: release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-mac:
    runs-on: macos-14
    permissions:
      contents: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - name: Check dependency security
        run: npm run check:security

      - name: Build unsigned macOS review artifacts
        run: npm run dist:review

      - name: Check the packaged bundle
        run: node scripts/check-bundle.mjs

      # A single rolling tag, moved to the pushed commit on every run, so
      # "à chaque modification" doesn't grow a release per commit forever.
      # The tag is force-pushed and the previous release under it replaced.
      - name: Publish the unsigned test prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete continuous --repo ${{ github.repository }} --yes --cleanup-tag || true
          gh release create continuous \
            --repo ${{ github.repository }} \
            --prerelease \
            --title "ScalAI (continuous build)" \
            --notes "Unsigned macOS test build from ${{ github.sha }}." \
            --target "${{ github.sha }}" \
            release-review/*.dmg release-review/*.zip release-review/*.blockmap

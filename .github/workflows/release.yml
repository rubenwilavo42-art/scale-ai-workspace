# Tag a review build and publish its unsigned macOS artifacts as a prerelease.
name: release

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - name: Check dependency security
        run: npm run check:security

      - name: Build unsigned macOS review artifacts
        run: npm run dist:review

      - name: Check the packaged bundle
        run: node scripts/check-bundle.mjs

      - name: Publish the unsigned test prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo ${{ github.repository }} \
            --prerelease \
            --title "ScalAI ${GITHUB_REF_NAME}" \
            --notes "Unsigned macOS test build for ${GITHUB_REF_NAME}." \
            release-review/*.dmg release-review/*.zip release-review/*.blockmap
